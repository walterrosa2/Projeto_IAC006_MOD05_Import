[project]
name = "classificador-contabil"
version = "0.1.0"
description = "Esteira de classificacao documental e lancamentos contabeis com IA para escritorio contabil"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data", "logs", "PRD"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
